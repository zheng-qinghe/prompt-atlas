<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="FITcQNDbdWB8FDuB05NNxn">
<head data-page-node-id="aWHVXLOmMMpsshODtn9GKY">
<meta charset="UTF-8" data-page-node-id="w2gD7x96kNXU0NhlcoTPKt">

<title>Prompt Atlas · 提示词向导</title>
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e3e1dc;
    --border-strong: #cfcdc7;
    --text: #26251f;
    --text-2: #6b6a64;
    --text-3: #94938c;
    --accent: #185FA5;
    --accent-bg: #E6F1FB;
    --warn-bg: #FAEEDA;
    --warn-border: #EF9F27;
    --warn-text: #854F0B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--text-2); }
  .layout {
    display: grid;
    grid-template-columns: 264px minmax(0, 1fr);
    gap: 20px;
    padding: 20px 28px 48px;
    max-width: 1280px;
    margin: 0 auto;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .panel + .panel { margin-top: 14px; }
  #search {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    margin-bottom: 10px;
  }
  #search:focus { outline: 2px solid var(--accent-bg); border-color: var(--accent); }
  .cat-tag {
    display: inline-block;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent-bg);
    color: var(--accent);
    margin-right: 6px;
  }
  .recipe {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .recipe:hover { background: var(--bg); }
  .recipe.active { background: var(--accent-bg); border-color: var(--accent); }
  .recipe .n { font-weight: 500; font-size: 13px; }
  .recipe .s { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  h2.sec { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--text-2); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 7px 9px;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text);
  }
  .field textarea { min-height: 68px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--accent-bg); border-color: var(--accent);
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row label { font-size: 12px; color: var(--text-2); }
  .row select { padding: 6px 9px; font: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); }
  .hint { font-size: 12px; color: var(--text-3); margin-left: auto; }
  .notice {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .profile {
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.7;
    margin-bottom: 12px;
  }
  pre#output {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 220px;
    margin: 0 0 10px;
    color: var(--text);
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 7px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { background: var(--bg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: .9; }
  .empty { color: var(--text-3); font-size: 13px; padding: 24px 0; text-align: center; }
  footer { max-width: 1280px; margin: 0 auto; padding: 0 28px 40px; font-size: 12px; color: var(--text-3); line-height: 1.7; }
</style>
</head>
<body data-page-node-id="8SIp7tYpTcCGdOGiNWeA0c">

<header data-page-node-id="l6Us8ScKYZg5eZDi3LzzWL">
  <h1 data-page-node-id="COlwMvEdFzBF7gw6ov5huM">Prompt Atlas · 提示词向导</h1>
  <p data-page-node-id="DBvA9t1aotF3AbC5vXXeRL">选配方、填参数、挑模型族，生成可直接使用的结构化提示词。纯前端运行，不上传任何数据。</p>
</header>

<div class="layout" data-page-node-id="OGLRI3aRebJMdBBgLlRg4i">
  <aside data-page-node-id="68Z3bIOFHSHlR9WIkEyBJp">
    <div class="panel" data-page-node-id="hn8hK8BONwTJLE1nVEtsz1">
      <input id="search" type="search" placeholder="搜索配方…" data-page-node-id="k3vCEHtkZFOJDwo9dITs8D">
      <div id="recipeList" data-page-node-id="PIKvJxE6cWLNmwUas8irPf"></div>
    </div>
  </aside>

  <section data-page-node-id="p1vcOnWmMgh3X8szkpwY1k">
    <div class="panel" data-page-node-id="t0HYfhd59LMhqSRt3z9IKP">
      <h2 class="sec" id="formTitle" data-page-node-id="SiexlvLrS2IUrfCfynXXEN">参数</h2>
      <div id="form" data-page-node-id="jpFsAnQhmxzrXuGlsWamzW"></div>
    </div>

    <div class="panel" data-page-node-id="jXUhTtoF9G4AAChEpbeKKb">
      <div class="row" style="margin-bottom:6px" data-page-node-id="H2SAZUkHWWnpuAilf5xUcs">
        <label for="modelSel" data-page-node-id="4mEAIS67CR53AGDvfdxqN1">目标模型族</label>
        <select id="modelSel" data-page-node-id="1us39hrYoOm1shTN5gGudM"></select>
        <span class="hint" id="rnote" data-page-node-id="UeqK0LvjoniFGuZ50wnXnT"></span>
      </div>
      <p class="hint" style="margin:0 0 10px 0" data-page-node-id="HintRuleGroup">提示词书写规则按厂商（族）区分；同一族内的不同模型共享规则，差异只在能力、成本与推理档位。二级列表是该族下可选模型的能力参考。</p>
      <div class="profile" id="profile" style="display:none" data-page-node-id="PAp0AtlasProf"></div>
      <div class="notice" id="notice" style="display:none" data-page-node-id="EAa6rwNLraE4c5k7HZCr7m"></div>
      <pre id="output" data-page-node-id="8qUPkKsypS1xkPEAzoHL4x"></pre>
      <button class="primary" id="copy" data-page-node-id="bpWb12HysBrwR5b5x46KfQ">复制提示词</button>
    </div>
  </section>
</div>

<footer data-page-node-id="961u4nbGaBr2IoYDqKHh9M">
  方言差异只影响格式偏好层（约一成半），八成的提示词原则在所有模型上通用。真正决定效果的是档位参数、原生 schema 支持与上下文量级，而非措辞。
</footer>

<script src="data.js"></script>
<script>
(function () {
  var recipes = window.PROMPT_RECIPES || [];
  var renderers = window.RENDERERS || {};
  var cats = window.CATEGORIES || {};
  var current = null;

  var listEl = document.getElementById('recipeList');
  var formEl = document.getElementById('form');
  var formTitle = document.getElementById('formTitle');
  var outEl = document.getElementById('output');
  var noticeEl = document.getElementById('notice');
  var searchEl = document.getElementById('search');
  var modelSel = document.getElementById('modelSel');
  var rnoteEl = document.getElementById('rnote');
  var profileEl = document.getElementById('profile');
  var copyBtn = document.getElementById('copy');

  var registry = window.MODEL_REGISTRY || [];
  registry.forEach(function (g) {
    var og = document.createElement('optgroup');
    og.label = g.familyLabel;
    g.models.forEach(function (m) {
      var o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.name;
      o.title = m.desc || '';
      og.appendChild(o);
    });
    modelSel.appendChild(og);
  });
  if (registry.length && registry[0].models.length) modelSel.value = registry[0].models[0].id;

  function renderList() {
    var q = (searchEl.value || '').trim().toLowerCase();
    listEl.innerHTML = '';
    var hit = recipes.filter(function (r) {
      if (!q) return true;
      return (r.name + r.summary + (cats[r.category] || '')).toLowerCase().indexOf(q) >= 0;
    });
    if (!hit.length) {
      listEl.innerHTML = '<div class="empty">没有匹配的配方</div>';
      return;
    }
    hit.forEach(function (r) {
      var d = document.createElement('div');
      d.className = 'recipe' + (current && current.id === r.id ? ' active' : '');
      d.innerHTML = '<div class="n"><span class="cat-tag">' + r.category + '</span>' + esc(r.name) + '</div>'
        + '<div class="s">' + esc(r.summary) + '</div>';
      d.onclick = function () { select(r); };
      listEl.appendChild(d);
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function select(r) {
    current = r;
    formTitle.textContent = r.name + '（' + r.category + ' ' + (cats[r.category] || '') + '）';
    formEl.innerHTML = '';
    r.fields.forEach(function (f) {
      var wrap = document.createElement('div');
      wrap.className = 'field';
      var lab = document.createElement('label');
      lab.textContent = f.label;
      var el;
      if (f.type === 'textarea') {
        el = document.createElement('textarea');
      } else if (f.type === 'select') {
        el = document.createElement('select');
        (f.options || []).forEach(function (op) {
          var o = document.createElement('option');
          o.value = op[0];
          o.textContent = op[1];
          el.appendChild(o);
        });
      } else {
        el = document.createElement('input');
        el.type = 'text';
      }
      if (f.ph) el.placeholder = f.ph;
      el.setAttribute('data-key', f.key);
      el.oninput = generate;
      if (el.tagName === 'SELECT') el.onchange = generate;
      wrap.appendChild(lab);
      wrap.appendChild(el);
      formEl.appendChild(wrap);
    });
    renderList();
    if (current.category === 'V') {
      var vm = null;
      for (var gi = 0; gi < registry.length; gi++) {
        if (registry[gi].kind === 'visual' && registry[gi].models.length) { vm = registry[gi].models[0].id; break; }
      }
      if (vm) modelSel.value = vm;
    }
    generate();
  }

  function selectedModel() {
    var id = modelSel.value;
    for (var i = 0; i < registry.length; i++) {
      for (var j = 0; j < registry[i].models.length; j++) {
        if (registry[i].models[j].id === id) {
          var m = registry[i].models[j];
          return {
            id: m.id, name: m.name, desc: m.desc, reasoning: m.reasoning,
            family: registry[i].family, familyLabel: registry[i].familyLabel,
            renderer: registry[i].renderer, profile: registry[i].profile,
            variant: m.variant, kind: registry[i].kind
          };
        }
      }
    }
    return null;
  }

  function generate() {
    if (!current) return;
    var v = {};
    current.fields.forEach(function (f) {
      var el = formEl.querySelector('[data-key="' + f.key + '"]');
      v[f.key] = el ? el.value : '';
    });
    var sel = selectedModel();
    var ctx = sel ? {
      family: sel.familyLabel, model: sel.name, renderer: sel.renderer,
      reasoning: sel.reasoning, familyTip: sel.profile ? sel.profile.tip : '',
      variant: sel.variant || ''
    } : {};
    var s = current.build(v, ctx);
    var rk;
    if (current.category === 'V') {
      rk = (current.id === 'image-prompt') ? 'image' : 'video';
    } else {
      rk = (sel && sel.renderer) ? sel.renderer : 'markdown';
    }
    outEl.textContent = renderers[rk] ? renderers[rk].render(s) : '';
    rnoteEl.textContent = renderers[rk] ? renderers[rk].note : '';
    if (s.notice) {
      noticeEl.textContent = s.notice;
      noticeEl.style.display = 'block';
    } else {
      noticeEl.style.display = 'none';
    }
    if (sel && sel.profile) {
      var badge = (sel.kind === 'visual') ? '视觉模型' : (sel.reasoning ? '推理档' : '标准档');
      var tail = (sel.kind === 'visual')
        ? '图像/视频模型写法按具体模型分支（Midjourney 用 -- 参数、Flux/SDXL 用正负向；可灵用中文结构化、Sora/Runway 用自然语言）。'
        : '该族内所有模型提示词书写规则一致，差异仅在能力、成本与推理档位。';
      profileEl.innerHTML = '<b>' + esc(sel.familyLabel) + ' · ' + esc(sel.name) + '</b>'
        + ' <span style="color:var(--text-3)">(' + badge + ')</span><br>'
        + '长项：' + esc(sel.profile.long) + '<br>'
        + '短板：' + esc(sel.profile.short) + '<br>'
        + '提示词要点：' + esc(sel.profile.tip) + '<br>'
        + '<span style="color:var(--text-3)">' + tail + '</span>';
      profileEl.style.display = 'block';
    } else {
      profileEl.style.display = 'none';
    }
  }

  copyBtn.onclick = function () {
    var text = outEl.textContent;
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fail);
    } else {
      fail();
    }
    function ok() { flash('已复制'); }
    function fail() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); flash('已复制'); }
      catch (e) { flash('复制失败，请手动选中'); }
      document.body.removeChild(ta);
    }
    function flash(msg) {
      var old = copyBtn.textContent;
      copyBtn.textContent = msg;
      setTimeout(function () { copyBtn.textContent = old; }, 1400);
    }
  };

  searchEl.oninput = renderList;
  modelSel.onchange = generate;

  renderList();
  if (recipes.length) select(recipes[0]);
})();
</script>
</body>
